[tool.ruff.lint]
select = ["E", "F", "C90", "PLR", "SIM"]

[tool.coverage.run]
source = ["src"]
omit = [
	"src/__main__.py",
	"src/todoList.py",
	"src/ui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cache-clear --ff --cov=src --cov-report=html --cov-report=term --cov-report=xml"
